[project]
name = "tennis"
version = "0.1.0"
description = "Tennis stroke classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "torch",
    "torchvision",
    "opencv-python",
    "matplotlib",
    "mediapipe",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tennis"]
